<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chez Zette – Poste 1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe4ef;--fg:#2a2226;--card:#f8c3d8;--ac:#d4639b;--ok:#2f8f84;--lp:#f4a8c7;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1822;--fg:#fff0f6;--card:#44263a}}
:root[data-theme="dark"]{--bg:#2b1822;--fg:#fff0f6;--card:#44263a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:18px system-ui,sans-serif}
nav{display:flex;gap:8px;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
nav button{flex:1;padding:14px;font-size:18px;border:0;border-radius:12px;background:var(--card);color:var(--fg)}
nav button.on{background:var(--ok);color:#fff}
main{padding:0 10px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{padding:18px 8px;border:0;border-radius:14px;background:var(--card);color:var(--fg);font-size:18px}
.item b{display:block;margin-top:4px;color:var(--ok)}
.cart{margin:14px 0;padding:12px;border-radius:14px;background:var(--card)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:8px}
.big{width:100%;padding:16px;font-size:20px;border:0;border-radius:14px;background:var(--ok);color:#fff;margin-top:8px}
.big:disabled{opacity:.4}
.sm{padding:8px 14px;font-size:16px;border:0;border-radius:10px;background:var(--ac);color:#fff}
.gray{background:#888}
.chip{margin:4px;padding:12px 16px;font-size:17px;border:2px solid #8885;border-radius:22px;background:var(--card);color:var(--fg)}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
h2,h3{margin:12px 0 4px}
small{opacity:.7;display:block}
.tk{padding:12px;border-radius:14px;background:var(--card);margin-bottom:10px;border-left:8px solid var(--ac)}
.tk.ready{border-color:var(--ok)}
.tk h3{margin:0 0 6px}
input,textarea{width:100%;box-sizing:border-box;padding:10px;font-size:17px;border-radius:10px;border:1px solid #8886;background:var(--bg);color:var(--fg)}
.msg{padding:20px;text-align:center}
header{background:var(--lp);color:var(--ok);display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 10px}header img{width:76px;height:76px;border-radius:50%}header b{font:400 38px/1.1 'Lobster','Pacifico','Brush Script MT',cursive}
.tk.new{border-color:var(--ac)}.tk.done{border-color:#999;opacity:.8}.tk .row h3{margin:0}
nav:empty{display:none}code{font-size:14px}
.badge{display:inline-block;background:#e8590c;color:#fff;font:700 14px system-ui,sans-serif;padding:4px 10px;border-radius:12px;vertical-align:middle;margin-left:6px}.tk.emp{border-left-width:14px;border-color:#e8590c}
.badge.upd{background:#7048e8}.tk .add{background:rgba(232,89,12,.14);border-radius:8px;padding:2px 6px;margin:3px 0}
</style></head><body>

  return (l.length?l.map(o=>orderCard(o,'caisse')).join(''):'<div class="msg">'+(f?'Aucune commande à ce prénom':cf==='web'?'Aucune commande en ligne à valider':cf==='annulees'?'Aucune commande refusée ou supprimée':cf==='servies'?'Aucune commande servie':'Aucune commande en cours')+'</div>')+`<div class="msg">Aujourd'hui : ${ok.length} commande(s), ${eur(ok.reduce((s,o)=>s+o.total,0))}</div>`;
 }
 if(view==='encours'){const l=orders.filter(o=>o.status!=='done'&&o.status!=='web'&&!OFF(o.status)&&!isHid(o)&&showsHere(o)).sort((a,b)=>a.createdAt-b.createdAt);return l.length?l.map(o=>orderCard(o,'cuisine')).join(''):'<div class="msg">Aucune commande en cours</div>'}
 const l=orders.filter(o=>o.status!=='done'&&o.status!=='web'&&!OFF(o.status)&&isHid(o)&&showsHere(o)).sort((a,b)=>b.createdAt-a.createdAt);return l.length?l.map(o=>orderCard(o,'retirees')).join(''):'<div class="msg">Aucune commande retirée de cet écran</div>';
}
function tabletHTML(){
 if(!B.hosted)return '';
 return `<h3>Cette tablette</h3><small>Pour un écran de cuisine : il n'affichera ni prix, ni total, ni menu.</small><input id="pin" placeholder="Code pour quitter le mode cuisine (4 chiffres ou plus)" inputmode="numeric" style="margin-top:6px"><button class="big gray" id="tocuisine">Passer cette tablette en mode cuisine</button>`;
}
function exitHTML(){
 if(!(B.hosted&&LS.get('zette_mode')==='cuisine'))return '';
 return `<div style="margin-top:30px;text-align:center"><details><summary style="opacity:.6">Quitter le mode cuisine</summary><input id="pinout" type="password" inputmode="numeric" placeholder="Code" style="margin:6px 0"><button class="sm gray" id="exitk">Valider</button></details></div>`;
}
function render(){
 $('#nav').innerHTML=ready?TABS.map(([v,l])=>`<button data-tab="${v}" class="${v===view?'on':''}">${l}</button>`).join(''):'';
 const el=$('#app');
 if(!ready){el.innerHTML=B.loginHTML();return}
 if(view==='suivi')el.innerHTML=suiviHTML();
 else if(view==='caisse')el.innerHTML=caisseHTML();
 else if(view==='menu')el.innerHTML=`<div id="rupt">${ruptHTML()}</div>`+Object.keys(DEF).map(k=>`<h3>${LABELS[k]}</h3><textarea id="m-${k}" rows="${k==='cat'?16:4}">${esc(cfg[k])}</textarea>`).join('')+
  `<small style="margin-top:8px">Catégorie : <code>## Nom | options | texte d'aide</code>, puis une ligne <code>Nom;prix</code> par article. Options : viande, sauce, garniture, supp, base, enfant. Pour limiter : <code>supp:Cheddar/Viande</code>.</small><button class="big" id="savem">Enregistrer le menu</button>${B.login?'<button class="big gray" id="logout">Verrouiller la tablette</button>':''}<button class="big" id="wipe" style="background:#c92a2a">Fin de journée : tout effacer</button>`+`<div id="photos">${photosHTML()}</div><input type="file" id="phfile" accept="image/*" style="display:none">`+tabletHTML();
 else{el.innerHTML=(view==='commandes'?webBanner():'')+(MODE==='cuisine'&&STATION?`<div style="margin:6px 0;font-weight:700;font-size:1.1em">${STN[STATION]||''}</div>`:'')+(view==='commandes'?`<div class="row" style="gap:6px;margin-top:6px">${[['actives','En cours'],['web','🌐 En ligne'],['servies','Servies'],['toutes','Toutes'],['annulees','🗑 Annulées'],['ventes','📊 Ventes']].map(([k,l])=>`<button class="chip ${cf===k?'on':''}" data-f="${k}" style="flex:1;margin:0">${l}</button>`).join('')}</div>${cf==='ventes'?'':`<input id="q" placeholder="Chercher un prénom (dans toutes les commandes)" value="${esc(q)}" style="margin:6px 0">`}`:'')+`<div id="list">${listHTML()}</div>`+exitHTML()}
}
function onData(d){
 ready=true;
 if(d.orders){const nz=o=>{const x=parseSt(o.status);return {...o,raw:o.status,status:x.base,pd:x.pd,gv:x.gv}};orders=MODE==='cuisine'?d.orders.map(o=>({...nz(o),total:0,items:(o.items||[]).map(i=>({...i,price:0}))})):d.orders.map(nz)}
 if(d.cfg){Object.keys(DEF).forEach(k=>{if(typeof d.cfg[k]==='string'&&d.cfg[k].trim()&&cfg[k]!==d.cfg[k]){cfg[k]=d.cfg[k];cfgChanged=true}});if(typeof d.cfg.rupt==='string'&&(cfg.rupt||'')!==d.cfg.rupt){cfg.rupt=d.cfg.rupt;cfgChanged=true}}
 if(d.photos){PH=d.photos;if(view==='caisse'&&!sheet&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))cfgChanged=true;const p=$('#photos');if(p)p.innerHTML=photosHTML()}
 if(!$('#nav').innerHTML){render();cfgChanged=false;return}
 if(view==='commandes'||view==='caisse'){const wb=$('[data-gotoweb]'),h=webBanner();if(wb&&!h)wb.remove();else if(h&&!wb&&!sheet)cfgChanged=true;else if(wb&&h)wb.outerHTML=h}
 if((view==='commandes'||view==='encours'||view==='retirees')&&$('#list'))$('#list').innerHTML=listHTML();
 else if(view==='caisse'&&cfgChanged&&!sheet)render();
 cfgChanged=false;
}
function pickItem(ci,ii){
 const c=parseCat(cfg.cat)[ci],it=c.items[ii];
 if(ruptSet().has('i:'+it.name)){toast(it.name+' : en rupture');return}
 if(!c.opts.length){addLine({name:it.name,detail:'',drink:'',inote:'',price:it.price,st:stationsFor(c.name,it.name,''),src:{c:c.name,i:it.name,s:{}}});const n=cart.filter(l=>l.src&&l.src.i===it.name).reduce((a,l)=>a+l.qty,0);toast(it.name+' ajouté'+(n>1?' (x'+n+')':''));render();return}
 sheet={c,it,sel:newSel()};render();
}
document.addEventListener('input',e=>{
 if(e.target.id==='cname'){cname=e.target.value;dupAck='';const w=$('#dupw');if(w)w.textContent=dupHTML()}
 if(e.target.id==='tlabel'&&sheet)sheet.sel.label=e.target.value;
 if(e.target.id==='inote'&&sheet)sheet.sel.note=e.target.value;
 else if(e.target.id==='note')note=e.target.value;
 else if(e.target.id==='q'){q=e.target.value;$('#list').innerHTML=listHTML()}
});
document.addEventListener('change',async e=>{
 if(e.target.id!=='phfile'||!photoTarget)return;const f=e.target.files&&e.target.files[0];if(!f)return;const n=photoTarget;photoTarget=null;
 try{toast('Enregistrement de la photo…');const d=await resizeImg(f);await B.savePhoto(n,d);PH[n]=d;const p=$('#photos');if(p)p.innerHTML=photosHTML();toast('Photo enregistrée ✓')}catch(err){toast('Erreur photo : '+(err.message||err))}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code')$('#login').click()});
document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;
 const fail=err=>toast('Erreur : '+(err.message||err.code||err));
 if(t.id==='login'){const code=$('#code').value;if(!code)return;if(!(await B.signin(code))){toast('Code incorrect');return}return}
 if(t.id==='logout'){await B.signout();location.reload();return}
 if(t.dataset.tab){view=t.dataset.tab;step=null;sheet=null;render();return}
 if(t.dataset.cat!==undefined){const ci=+t.dataset.cat,c=parseCat(cfg.cat)[ci];if(c.items.length===1)pickItem(ci,0);else{step=ci;render()}return}
 if(t.dataset.mode!==undefined){emp=t.dataset.mode==='1';render();return}
 if(t.dataset.f){cf=t.dataset.f;render();return}
 if(t.dataset.back){step=null;render();return}
 if(t.dataset.pick!==undefined){pickItem(step,+t.dataset.pick);return}
 if(t.dataset.ch){const k=t.dataset.ch,v=t.dataset.v,s=sheet.sel;if(s[k] instanceof Set){s[k].has(v)?s[k].delete(v):s[k].add(v)}else s[k]=s[k]===v?'':v;render();return}
 if(t.dataset.sq){sheet.sel.qty=Math.max(1,(sheet.sel.qty||1)+(+t.dataset.sq));render();return}
 if(t.dataset.plus){sheet.sel.plus=Math.max(0,(sheet.sel.plus||0)+(+t.dataset.plus));render();return}
 if(t.dataset.edl!==undefined){const i=+t.dataset.edl,l=cart[i],src=l&&l.src;const c=src&&parseCat(cfg.cat).find(x=>x.name===src.c);const it=c&&c.items.find(x=>x.name===src.i);if(!it){toast('Article introuvable dans le menu : supprimez-le et ajoutez-le à nouveau');return}const z=src.s||{};sheet={c,it,editIdx:i,sel:{...newSel(),...z,qty:l.qty||1,sauce:new Set(z.sauce||[]),garniture:new Set(z.garniture||[]),supp:new Set(z.supp||[])}};render();return}
 if(t.id==='cancel'){sheet=null;render();return}
 if(t.id==='addit'){
  const {c,it,sel}=sheet,d=[];
  if(c.opts.some(o=>o.k==='enfant')&&!sel.plat){toast('Choisissez le plat');return}
  if(c.opts.some(o=>o.k==='viande')&&!sel.viande){toast('Choisissez la viande');return}
  const vs=c.opts.some(o=>o.k==='viande')&&[...sel.supp].some(n=>/viande/i.test(n));
  if(vs&&!sel.vsupp){toast('Choisissez la viande du supplément');return}
  const sans=[...sel.garniture].filter(n=>/^sans/i.test(n)),gar=[...sel.garniture].filter(n=>!/^sans/i.test(n));
  if(sel.base&&/^sans/i.test(sel.base))sans.push(sel.base);
  if(sel.supp.size)d.push('Supp : '+[...sel.supp].map(n=>vs&&/viande/i.test(n)?n+' ('+sel.vsupp+')':n).join(', '));
  if(sel.plus)d.push('+'+sel.plus+' tender'+(sel.plus>1?'s':''));
  if(sans.length)d.push(sans.join(', '));
  if(sel.plat)d.push(sel.plat);
  if(sel.viande)d.push(sel.viande);
  if(sel.base&&!/^sans/i.test(sel.base))d.push(sel.base);
  if(gar.length)d.push(gar.join(', '));
  if(sel.sauce.size)d.push('Sauces : '+[...sel.sauce].join(', '));
  const lb=(sel.label||'').trim();
  const src={c:c.name,i:it.name,s:{...sel,qty:undefined,sauce:[...sel.sauce],garniture:[...sel.garniture],supp:[...sel.supp]}};
  const line={name:it.name+(lb?' « '+lb+' »':''),detail:d.join(' · '),drink:sel.boisson||'',inote:(sel.note||'').trim(),price:sheetPrice(),st:stationsFor(c.name,it.name,sel.plat),src};
  if(sheet.editIdx!=null&&cart[sheet.editIdx]){const old=cart[sheet.editIdx];cart[sheet.editIdx]={...old,...line,qty:sel.qty||1,k:keyOf(line)}}else addLine(line,sel.qty||1);
  sheet=null;step=null;render();return}
 if(t.dataset.del!==undefined){cart.splice(+t.dataset.del,1);render();return}
 if(t.dataset.inc!==undefined){cart[+t.dataset.inc].qty++;render();return}
 if(t.dataset.dec!==undefined){const l=cart[+t.dataset.dec];if(l.qty>1)l.qty--;else cart.splice(+t.dataset.dec,1);render();return}
 if(t.id==='send'){
  if(editId){const o=byId(editId);if(!o){toast('Commande introuvable');leaveAdd();render();return}
   if(!cname.trim()){toast('Entrez le prénom du client');return}
   const items=routeItems(cart.map(({k,...r})=>r)),total=cartTotal();
   const sig=l=>JSON.stringify(l.map(i=>[i.name,i.detail,i.drink||'',i.inote||'',i.qty||1]));
   const changed=sig(items)!==sig(o.items);
   try{await B.addItems(o,{items,total,name:cname.trim(),note:note.trim(),takeaway:emp,rev:(o.rev||0)+1,status:changed?'new':(o.raw||o.status)});leaveAdd();view='commandes';cf='actives';step=null;render();toast('Commande modifiée ✓')}catch(err){fail(err)}
   return}
  if(addTo){
   const o=byId(addTo);
   if(!o){toast('Commande introuvable');leaveAdd();render();return}
   const now=Date.now();
   const add=cart.map(c=>({name:c.name,detail:c.detail,drink:c.drink||'',inote:c.inote||'',st:c.st,src:c.src,qty:c.qty,price:c.price,added:true,at:now}));
   const sum=cartTotal();
   try{await B.addItems(o,{items:routeItems(o.items.concat(add)),total:o.total+sum,rev:(o.rev||0)+1,status:fmtSt({base:'new',pd:[],gv:o.gv||[]})});const nm=o.name||('N° '+o.num);leaveAdd();view='commandes';cf='actives';step=null;render();toast('Ajouté à la commande de '+nm+' ✓')}catch(err){fail(err)}
   return}
  if(!cname.trim()){toast(MODE==='client'?'Entrez votre prénom':'Entrez le prénom du client');const i=$('#cname');if(i)i.focus();return}
  if(MODE==='client'){const items=routeItems(cart.map(({k,gv,...r})=>r));t.disabled=true;
   try{await B.send({name:cname.trim(),items,note:note.trim(),takeaway:emp});cart=[];cname='';note='';emp=false;step=null;webSt='web';view='suivi';render();pollWeb();scrollTo(0,0)}catch(err){t.disabled=false;fail(err)}return}
  const dn=cname.trim().toLowerCase();
  if(dupFind()&&dupAck!==dn){dupAck=dn;const w=$('#dupw');if(w)w.textContent=dupHTML();toast('Ce prénom a déjà une commande récente');return}
  const items=routeItems(cart.map(c=>({name:c.name,detail:c.detail,drink:c.drink||'',inote:c.inote||'',st:c.st,src:c.src,qty:c.qty,price:c.price})));
  const total=cartTotal();
  try{await B.send({day:getDay(),name:cname.trim(),items,total,note:note.trim(),takeaway:emp});cart=[];cname='';note='';emp=false;dupAck='';step=null;render();toast('Envoyée en cuisine ✓')}catch(err){fail(err)}
  return}
 if(t.dataset.editord){const o=byId(t.dataset.editord);if(!o)return;if(!addTo&&!editId)held={cart,cname,note,emp};addTo=null;editId=o.id;cart=o.items.map((i,k)=>({...i,gv:isGiven(o,k)||undefined,qty:i.qty||1,k:keyOf(i)}));cname=o.name||'';note=o.note||'';emp=!!o.takeaway;view='caisse';step=null;sheet=null;render();return}
 if(t.dataset.addto){if(!addTo&&!editId)held={cart,cname,note,emp};editId=null;addTo=t.dataset.addto;cart=[];cname='';note='';emp=false;view='caisse';step=null;sheet=null;render();return}
 if(t.dataset.canceladd){leaveAdd();render();return}
 if(t.dataset.hide){const o=byId(t.dataset.hide);if(o){hideOrder(o);render()}return}
 if(t.dataset.unhide){const o=byId(t.dataset.unhide);if(o){showOrder(o);render()}return}
 if(t.id==='pick-caisse'){LS.set('zette_mode','caisse');if(LS.get('zette_mode')!=='caisse'){toast('Ce navigateur ne mémorise pas le choix');return}location.reload();return}
 if(t.id==='pick-cuisine'){const p=($('#pin0').value||'').trim();if(p.length<4){toast('Choisissez un code de 4 chiffres ou plus pour pouvoir quitter le mode cuisine');return}LS.set('zette_pin',p);LS.set('zette_mode','cuisine');if(LS.get('zette_mode')!=='cuisine'){toast('Ce navigateur ne mémorise pas le choix');return}location.reload();return}
 if(t.id==='tocuisine'){const p=($('#pin').value||'').trim();if(p.length<4){toast('Choisissez un code de 4 chiffres ou plus');return}LS.set('zette_pin',p);LS.set('zette_mode','cuisine');if(LS.get('zette_mode')!=='cuisine'){toast('Ce navigateur ne permet pas de mémoriser le mode cuisine');return}location.reload();return}
 if(t.id==='exitk'){if(($('#pinout').value||'')===LS.get('zette_pin')){LS.set('zette_mode','caisse');LS.del('zette_pin');location.reload()}else toast('Code incorrect');return}
 if(t.dataset.stready){const o=byId(t.dataset.stready);if(!o)return;try{await writeSt(o,x=>{if(x.base!=='new')return;if(!STATION){x.base='ready';return}if(!x.pd.includes(STATION))x.pd.push(STATION)})}catch(err){fail(err)}return}
 if(t.dataset.give!==undefined){const o=byId(t.dataset.id),k=+t.dataset.give;if(!o)return;t.disabled=true;try{await writeSt(o,x=>{if(!x.gv.includes(k))x.gv.push(k)})}catch(err){t.disabled=false;fail(err)}return}
 if(t.dataset.st){const o=byId(t.dataset.id);try{await B.status(t.dataset.id,fmtSt({base:t.dataset.st,pd:[],gv:(o&&o.gv)||[]}));if(o&&o.status==='deleted')toast('Commande restaurée ✓')}catch(err){fail(err)}return}
 if(t.dataset.gotoweb){view='commandes';cf='web';q='';render();return}
 if(t.dataset.accept){const o=byId(t.dataset.accept);if(!o)return;const items=routeItems(o.items.map(i=>{const p=priceOf(i);return {...i,price:p==null?i.price:p}}));const total=items.reduce((a,i)=>a+i.price*(i.qty||1),0);
  try{await B.addItems(o,{items,total,status:'new'});toast('Commande de '+(o.name||'')+' envoyée en cuisine ✓')}catch(err){fail(err)}return}
 if(t.dataset.refuse){if(!t.dataset.sure){t.dataset.sure='1';t.textContent='Sûr ? Retouchez';setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent='Refuser'}},4000);return}try{await B.status(t.dataset.refuse,'refused');toast('Commande refusée (récupérable dans « 🗑 Annulées »)')}catch(err){fail(err)}return}
 if(t.dataset.delo){if(!t.dataset.sure){t.dataset.sure='1';t.textContent='Supprimer ?';t.style.background='#c92a2a';setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent='🗑';t.style.background=''}},4000);return}
  const o=byId(t.dataset.delo);try{await B.status(t.dataset.delo,fmtSt({base:'deleted',pd:[],gv:(o&&o.gv)||[]}));toast('Commande supprimée (récupérable dans « 🗑 Annulées »)')}catch(err){fail(err)}return}
 if(t.dataset.rupt){const key=t.dataset.rupt,R=ruptSet();R.has(key)?R.delete(key):R.add(key);cfg.rupt=[...R].join('\n');const r=$('#rupt');if(r)r.innerHTML=ruptHTML();try{await B.saveCfg(cfg)}catch(err){fail(err)}return}
 if(t.dataset.photo){photoTarget=t.dataset.photo;const f=$('#phfile');if(f){f.value='';f.click()}return}
 if(t.dataset.unphoto){const n=t.dataset.unphoto;try{await B.delPhoto(n);delete PH[n];const p=$('#photos');if(p)p.innerHTML=photosHTML()}catch(err){fail(err)}return}
 if(t.dataset.suivi){view='suivi';render();pollWeb();return}
 if(t.id==='neworder'){view='caisse';step=null;sheet=null;render();return}
 if(t.id==='savem'){Object.keys(DEF).forEach(k=>cfg[k]=$('#m-'+k).value);try{await B.saveCfg(cfg);toast('Menu enregistré ✓')}catch(err){fail(err)}return}
 if(t.id==='wipe'){
  if(!t.dataset.sure){t.dataset.sure='1';t.textContent='Appuyez encore pour confirmer';setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent='Fin de journée : tout effacer'}},4000);return}
  try{await B.wipe();orders=[];t.textContent='Tout est effacé ✓';delete t.dataset.sure}catch(err){fail(err)}
  return}
});
(async()=>{ready=await B.init(onData);if(MODE==='client'&&B.mine){view='suivi';pollWeb()}render()})();
