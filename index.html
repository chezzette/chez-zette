<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chez Zette – Commandes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe4ef;--fg:#2a2226;--card:#f8c3d8;--ac:#d4639b;--ok:#2f8f84;--lp:#f4a8c7;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1822;--fg:#fff0f6;--card:#44263a}}
:root[data-theme="dark"]{--bg:#2b1822;--fg:#fff0f6;--card:#44263a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:18px system-ui,sans-serif}
nav{display:flex;gap:8px;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
nav button{flex:1;padding:14px;font-size:18px;border:0;border-radius:12px;background:var(--card);color:var(--fg)}
nav button.on{background:var(--ok);color:#fff}
main{padding:0 10px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{padding:18px 8px;border:0;border-radius:14px;background:var(--card);color:var(--fg);font-size:18px}
.item b{display:block;margin-top:4px;color:var(--ok)}
.cart{margin:14px 0;padding:12px;border-radius:14px;background:var(--card)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:8px}
.big{width:100%;padding:16px;font-size:20px;border:0;border-radius:14px;background:var(--ok);color:#fff;margin-top:8px}
.big:disabled{opacity:.4}
.sm{padding:8px 14px;font-size:16px;border:0;border-radius:10px;background:var(--ac);color:#fff}
.gray{background:#888}
.chip{margin:4px;padding:12px 16px;font-size:17px;border:2px solid #8885;border-radius:22px;background:var(--card);color:var(--fg)}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
h2,h3{margin:12px 0 4px}
small{opacity:.7;display:block}
.tk{padding:12px;border-radius:14px;background:var(--card);margin-bottom:10px;border-left:8px solid var(--ac)}
.tk.ready{border-color:var(--ok)}
.tk h3{margin:0 0 6px}
input,textarea{width:100%;box-sizing:border-box;padding:10px;font-size:17px;border-radius:10px;border:1px solid #8886;background:var(--bg);color:var(--fg)}
.msg{padding:20px;text-align:center}
header{background:var(--lp);color:var(--ok);display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 10px}header img{width:76px;height:76px;border-radius:50%}header b{font:400 38px/1.1 'Lobster','Pacifico','Brush Script MT',cursive}
.tk.new{border-color:var(--ac)}.tk.done{border-color:#999;opacity:.8}.tk .row h3{margin:0}
nav:empty{display:none}code{font-size:14px}
.badge{display:inline-block;background:#e8590c;color:#fff;font:700 14px system-ui,sans-serif;padding:4px 10px;border-radius:12px;vertical-align:middle;margin-left:6px}.tk.emp{border-left-width:14px;border-color:#e8590c}
.badge.upd{background:#7048e8}.tk .add{background:rgba(232,89,12,.14);border-radius:8px;padding:2px 6px;margin:3px 0}
</style></head><body>

 const chips=(k,list,multi)=>list.map(x=>`<button class="chip ${(multi?sel[k].has(x.n):sel[k]===x.n)?'on':''}" data-ch="${k}" data-v="${esc(x.n)}">${esc(x.n)}${x.p?' +'+eur(x.p):''}</button>`).join('');
 let h=`<h2>${esc(it.name)}</h2>`;
 if(c.opts.some(o=>o.k==='viande'))h+=`<h3>Nom du tacos <small>pour les différencier</small></h3><input id="tlabel" maxlength="30" placeholder="Ex : Karim, tacos 1…" value="${esc(sel.label)}">`;
 c.opts.forEach(o=>{
  if(o.k==='enfant'){h+=`<h3>Plat <small>frites incluses</small></h3>${chips('plat',listFor('plat'),0)}${c.opts.some(x=>x.k==='sauce')?'':`<h3>Sauces</h3>${chips('sauce',listFor('sauce'),1)}`}<h3>Boisson <small>(pas affichée en cuisine)</small></h3>${chips('boisson',listFor('boisson'),0)}`;return}
  if(!TITRES[o.k])return;
  h+=`<h3>${TITRES[o.k]}</h3>${chips(o.k,optList(o),['sauce','garniture','supp'].includes(o.k))}`;
 });
 return h+`<button class="big" id="addit">Ajouter – ${eur(sheetPrice())}</button><button class="big gray" id="cancel">Annuler</button>`;
}
function addBanner(){
 const ao=addTo&&byId(addTo);if(!ao)return '';
 return `<div class="cart" style="border:3px solid var(--ok)"><div class="row"><b>➕ Ajout à la commande de ${esc(ao.name||('N° '+ao.num))}</b><button class="sm gray" data-canceladd="1">Annuler l'ajout</button></div></div>`;
}
function addLine(l){const k=l.name+'|'+l.detail+'|'+(l.drink||'');const e=cart.find(c=>c.k===k);if(e)e.qty++;else cart.push({...l,k,qty:1})}
const cartTotal=()=>cart.reduce((s,c)=>s+c.price*c.qty,0);
function dupFind(){const n=cname.trim().toLowerCase();if(!n||addTo)return null;const lim=Date.now()-30*60e3;return orders.filter(o=>String(o.name||'').trim().toLowerCase()===n&&o.createdAt>=lim).sort((a,b)=>b.createdAt-a.createdAt)[0]||null}
function dupHTML(){const o=dupFind();return o?`⚠️ « ${esc(o.name)} » a déjà une commande il y a ${Math.max(1,Math.round((Date.now()-o.createdAt)/60000))} min (n° ${o.num}). Touchez « Envoyer » une 2e fois pour confirmer.`:''}
function cartHTML(){
 const ao=addTo&&byId(addTo);
 const total=cartTotal();
 const nm=ao?esc(ao.name||('N° '+ao.num)):'';
 return `<div class="cart">${cart.length?cart.map((c,i)=>`<div class="row"><span>${c.qty>1?'<b>x'+c.qty+'</b> ':''}${esc(c.name)}${c.detail||c.drink?`<small>${esc([c.detail,c.drink].filter(Boolean).join(' · '))}</small>`:''}</span><span>${eur(c.price*c.qty)} <button class="sm gray" data-dec="${i}">−</button><button class="sm" data-inc="${i}">+</button><button class="sm gray" data-del="${i}">×</button></span></div>`).join(''):'<div class="row">Panier vide</div>'}
 ${ao?'':`<div class="row" style="gap:6px"><button class="chip ${emp?'':'on'}" data-mode="0" style="flex:1;margin:0">Sur place</button><button class="chip ${emp?'on':''}" data-mode="1" style="flex:1;margin:0">🥡 À emporter</button></div>
 <input id="cname" placeholder="Prénom du client" value="${esc(cname)}" autocomplete="off" style="margin-top:8px"><div id="dupw" style="color:#c92a2a;font-weight:700">${dupHTML()}</div>
 <input id="note" placeholder="Note (sans oignon…)" value="${esc(note)}" style="margin-top:8px">`}
 <div class="row"><b>${ao?"Total de l'ajout":'Total'}</b><b>${eur(total)}</b></div>
 <button class="big" id="send" ${cart.length?'':'disabled'}>${ao?'Ajouter à la commande de '+nm:'Envoyer en cuisine'}</button></div>`;
}
function caisseHTML(){
 if(addTo&&!byId(addTo))leaveAdd();
 if(sheet)return sheetHTML();
 const cats=parseCat(cfg.cat),bn=addBanner();
 if(step!==null&&cats[step]){const c=cats[step];
  return bn+`<button class="sm gray" data-back="1" style="margin-top:6px">← Retour</button><h2>${esc(c.name)}</h2>${c.sub?`<small>${esc(c.sub)}</small>`:''}<div class="grid">${c.items.map((it,i)=>`<button class="item" data-pick="${i}">${esc(it.name)}<b>${eur(it.price)}</b></button>`).join('')}</div>`+cartHTML()}
 return bn+'<div class="grid">'+cats.map((c,i)=>`<button class="item" data-cat="${i}">${esc(c.name)}</button>`).join('')+'</div>'+cartHTML();
}
const STATUT={new:'En préparation',ready:'Prête',done:'Servie'};
// role : 'caisse' (prix + total), 'cuisine' ou 'retirees' (jamais de prix ni de total)
function orderCard(o,role){
 let btn;
 const rh=readyHere(o);
 if(role==='cuisine')btn=(o.status==='new'&&!rh)?`<button class="sm" data-stready="${o.id}">Prête</button>`:`<button class="sm gray" data-hide="${o.id}">Retirer de cet écran</button>`;
 else if(role==='retirees')btn=`<button class="sm gray" data-unhide="${o.id}">Remettre sur cet écran</button>`;
 else btn=o.status==='done'?`<button class="sm gray" data-st="new" data-id="${o.id}">Remettre en cuisine</button>`:`<button class="sm gray" data-st="done" data-id="${o.id}">Servie</button>`;
 const add=role==='caisse'&&o.status!=='done'?`<button class="sm" data-addto="${o.id}">+ Ajouter</button>`:'';
 const upd=o.rev&&o.status==='new'?' <span class="badge upd">✏️ MODIFIÉE</span>':'';
 const items=(role==='caisse'?o.items:hereItems(o)).map(i=>{const dt=[i.detail,role==='caisse'?i.drink:''].filter(Boolean).join(' · ');return `<div class="${i.added?'add':''}"><b>x${i.qty||1}</b> ${esc(i.name)}${i.added?` <span class="badge">➕ AJOUTÉ${i.at?' '+hm(i.at):''}</span>`:''}${dt?`<small>${esc(dt)}</small>`:''}</div>`}).join('');
 return `<div class="tk ${o.status}${o.takeaway?' emp':''}"><div class="row"><h3>${esc(o.name||('N° '+o.num))}${o.takeaway?' <span class="badge">🥡 À EMPORTER</span>':''}${upd}</h3><span>${hm(o.createdAt)} · ${rh?STATUT.ready:(STATUT[o.status]||'')}${role==='caisse'&&o.status==='new'&&(o.pd||[]).length?' · poste '+o.pd.join(', ')+' prêt':''}</span></div>${items}${o.note?`<div><i>${esc(o.note)}</i></div>`:''}<div class="row">${role==='caisse'?`<b>${eur(o.total)}</b>`:'<span></span>'}<span style="display:flex;gap:6px">${add}${btn}</span></div></div>`;
}
function listHTML(){
 if(view==='commandes'){
  const f=q.trim().toLowerCase();
  const l=orders.filter(o=>f?String(o.name||o.num).toLowerCase().includes(f):cf==='toutes'||(cf==='servies'?o.status==='done':o.status!=='done')).sort((a,b)=>b.createdAt-a.createdAt);
  return (l.length?l.map(o=>orderCard(o,'caisse')).join(''):'<div class="msg">'+(f?'Aucune commande à ce prénom':cf==='servies'?'Aucune commande servie':'Aucune commande en cours')+'</div>')+`<div class="msg">Aujourd'hui : ${orders.length} commande(s), ${eur(orders.reduce((s,o)=>s+o.total,0))}</div>`;
 }
 if(view==='encours'){const l=orders.filter(o=>o.status!=='done'&&!isHid(o)&&showsHere(o)).sort((a,b)=>a.createdAt-b.createdAt);return l.length?l.map(o=>orderCard(o,'cuisine')).join(''):'<div class="msg">Aucune commande en cours</div>'}
 const l=orders.filter(o=>o.status!=='done'&&isHid(o)&&showsHere(o)).sort((a,b)=>b.createdAt-a.createdAt);return l.length?l.map(o=>orderCard(o,'retirees')).join(''):'<div class="msg">Aucune commande retirée de cet écran</div>';
}
function tabletHTML(){
 if(!B.hosted)return '';
 return `<h3>Cette tablette</h3><small>Pour un écran de cuisine : il n'affichera ni prix, ni total, ni menu.</small><input id="pin" placeholder="Code pour quitter le mode cuisine (4 chiffres ou plus)" inputmode="numeric" style="margin-top:6px"><button class="big gray" id="tocuisine">Passer cette tablette en mode cuisine</button>`;
}
function exitHTML(){
 if(!(B.hosted&&LS.get('zette_mode')==='cuisine'))return '';
 return `<div style="margin-top:30px;text-align:center"><details><summary style="opacity:.6">Quitter le mode cuisine</summary><input id="pinout" type="password" inputmode="numeric" placeholder="Code" style="margin:6px 0"><button class="sm gray" id="exitk">Valider</button></details></div>`;
}
function render(){
 $('#nav').innerHTML=ready?TABS.map(([v,l])=>`<button data-tab="${v}" class="${v===view?'on':''}">${l}</button>`).join(''):'';
 const el=$('#app');
 if(!ready){el.innerHTML=B.loginHTML();return}
 if(view==='caisse')el.innerHTML=caisseHTML();
 else if(view==='menu')el.innerHTML=Object.keys(DEF).map(k=>`<h3>${LABELS[k]}</h3><textarea id="m-${k}" rows="${k==='cat'?16:4}">${esc(cfg[k])}</textarea>`).join('')+
  `<small style="margin-top:8px">Catégorie : <code>## Nom | options | texte d'aide</code>, puis une ligne <code>Nom;prix</code> par article. Options : viande, sauce, garniture, supp, base, enfant. Pour limiter : <code>supp:Cheddar/Viande</code>.</small><button class="big" id="savem">Enregistrer le menu</button>${B.login?'<button class="big gray" id="logout">Verrouiller la tablette</button>':''}<button class="big" id="wipe" style="background:#c92a2a">Fin de journée : tout effacer</button>`+tabletHTML();
 else{el.innerHTML=(MODE==='cuisine'&&STATION?`<div style="margin:6px 0;font-weight:700;font-size:1.1em">${STN[STATION]||''}</div>`:'')+(view==='commandes'?`<div class="row" style="gap:6px;margin-top:6px">${[['actives','En cours'],['servies','Servies'],['toutes','Toutes']].map(([k,l])=>`<button class="chip ${cf===k?'on':''}" data-f="${k}" style="flex:1;margin:0">${l}</button>`).join('')}</div><input id="q" placeholder="Chercher un prénom (dans toutes les commandes)" value="${esc(q)}" style="margin:6px 0">`:'')+`<div id="list">${listHTML()}</div>`+exitHTML()}
}
function onData(d){
 ready=true;
 if(d.orders){const nz=o=>{const p=String(o.status||'new').split('+');return {...o,status:p[0],pd:p[1]?p[1].split(','):[]}};orders=MODE==='cuisine'?d.orders.map(o=>({...nz(o),total:0,items:(o.items||[]).map(i=>({...i,price:0}))})):d.orders.map(nz)}
 if(d.cfg){Object.keys(DEF).forEach(k=>{if(typeof d.cfg[k]==='string'&&d.cfg[k].trim()&&cfg[k]!==d.cfg[k]){cfg[k]=d.cfg[k];cfgChanged=true}})}
 if(!$('#nav').innerHTML){render();cfgChanged=false;return}
 if((view==='commandes'||view==='encours'||view==='retirees')&&$('#list'))$('#list').innerHTML=listHTML();
 else if(view==='caisse'&&cfgChanged&&!sheet)render();
 cfgChanged=false;
}
function pickItem(ci,ii){
 const c=parseCat(cfg.cat)[ci],it=c.items[ii];
 if(!c.opts.length){addLine({name:it.name,detail:'',drink:'',price:it.price,st:stationsFor(c.name,it.name,'')});step=null;toast(it.name+' ajouté');render();return}
 sheet={c,it,sel:newSel()};render();
}
document.addEventListener('input',e=>{
 if(e.target.id==='cname'){cname=e.target.value;dupAck='';const w=$('#dupw');if(w)w.textContent=dupHTML()}
 if(e.target.id==='tlabel'&&sheet)sheet.sel.label=e.target.value;
 else if(e.target.id==='note')note=e.target.value;
 else if(e.target.id==='q'){q=e.target.value;$('#list').innerHTML=listHTML()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code')$('#login').click()});
document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;
 const fail=err=>toast('Erreur : '+(err.message||err.code||err));
 if(t.id==='login'){const code=$('#code').value;if(!code)return;if(!(await B.signin(code))){toast('Code incorrect');return}return}
 if(t.id==='logout'){await B.signout();location.reload();return}
 if(t.dataset.tab){view=t.dataset.tab;step=null;sheet=null;render();return}
 if(t.dataset.cat!==undefined){const ci=+t.dataset.cat,c=parseCat(cfg.cat)[ci];if(c.items.length===1)pickItem(ci,0);else{step=ci;render()}return}
 if(t.dataset.mode!==undefined){emp=t.dataset.mode==='1';render();return}
 if(t.dataset.f){cf=t.dataset.f;render();return}
 if(t.dataset.back){step=null;render();return}
 if(t.dataset.pick!==undefined){pickItem(step,+t.dataset.pick);return}
 if(t.dataset.ch){const k=t.dataset.ch,v=t.dataset.v,s=sheet.sel;if(s[k] instanceof Set){s[k].has(v)?s[k].delete(v):s[k].add(v)}else s[k]=s[k]===v?'':v;render();return}
 if(t.id==='cancel'){sheet=null;render();return}
 if(t.id==='addit'){
  const {c,it,sel}=sheet,d=[];
  if(c.opts.some(o=>o.k==='enfant')&&!sel.plat){toast('Choisissez le plat');return}
  if(c.opts.some(o=>o.k==='viande')&&!sel.viande){toast('Choisissez la viande');return}
  if(sel.plat)d.push(sel.plat);
  if(sel.viande)d.push(sel.viande);
  if(sel.base)d.push(sel.base);
  if(sel.garniture.size)d.push([...sel.garniture].join(', '));
  if(sel.sauce.size)d.push('Sauces : '+[...sel.sauce].join(', '));
  if(sel.supp.size)d.push('Supp : '+[...sel.supp].join(', '));
  const lb=(sel.label||'').trim();addLine({name:it.name+(lb?' « '+lb+' »':''),detail:d.join(' · '),drink:sel.boisson||'',price:sheetPrice(),st:stationsFor(c.name,it.name,sel.plat)});sheet=null;step=null;render();return}
 if(t.dataset.del!==undefined){cart.splice(+t.dataset.del,1);render();return}
 if(t.dataset.inc!==undefined){cart[+t.dataset.inc].qty++;render();return}
 if(t.dataset.dec!==undefined){const l=cart[+t.dataset.dec];if(l.qty>1)l.qty--;else cart.splice(+t.dataset.dec,1);render();return}
 if(t.id==='send'){
  if(addTo){
   const o=byId(addTo);
   if(!o){toast('Commande introuvable');leaveAdd();render();return}
   const now=Date.now();
   const add=cart.map(c=>({name:c.name,detail:c.detail,drink:c.drink||'',st:c.st,qty:c.qty,price:c.price,added:true,at:now}));
   const sum=cartTotal();
   try{await B.addItems(o,{items:o.items.concat(add),total:o.total+sum,rev:(o.rev||0)+1,status:'new'});const nm=o.name||('N° '+o.num);leaveAdd();view='commandes';cf='actives';step=null;render();toast('Ajouté à la commande de '+nm+' ✓')}catch(err){fail(err)}
   return}
  if(!cname.trim()){toast('Entrez le prénom du client');const i=$('#cname');if(i)i.focus();return}
  const dn=cname.trim().toLowerCase();
  if(dupFind()&&dupAck!==dn){dupAck=dn;const w=$('#dupw');if(w)w.textContent=dupHTML();toast('Ce prénom a déjà une commande récente');return}
  const items=cart.map(c=>({name:c.name,detail:c.detail,drink:c.drink||'',st:c.st,qty:c.qty,price:c.price}));
  const total=cartTotal();
  try{await B.send({day:getDay(),name:cname.trim(),items,total,note:note.trim(),takeaway:emp});cart=[];cname='';note='';emp=false;dupAck='';step=null;render();toast('Envoyée en cuisine ✓')}catch(err){fail(err)}
  return}
 if(t.dataset.addto){if(!addTo)held={cart,cname,note,emp};addTo=t.dataset.addto;cart=[];cname='';note='';emp=false;view='caisse';step=null;sheet=null;render();return}
 if(t.dataset.canceladd){leaveAdd();render();return}
 if(t.dataset.hide){const o=byId(t.dataset.hide);if(o){hideOrder(o);render()}return}
 if(t.dataset.unhide){const o=byId(t.dataset.unhide);if(o){showOrder(o);render()}return}
 if(t.id==='pick-caisse'){LS.set('zette_mode','caisse');if(LS.get('zette_mode')!=='caisse'){toast('Ce navigateur ne mémorise pas le choix');return}location.reload();return}
 if(t.id==='pick-cuisine'){const p=($('#pin0').value||'').trim();if(p.length<4){toast('Choisissez un code de 4 chiffres ou plus pour pouvoir quitter le mode cuisine');return}LS.set('zette_pin',p);LS.set('zette_mode','cuisine');if(LS.get('zette_mode')!=='cuisine'){toast('Ce navigateur ne mémorise pas le choix');return}location.reload();return}
 if(t.id==='tocuisine'){const p=($('#pin').value||'').trim();if(p.length<4){toast('Choisissez un code de 4 chiffres ou plus');return}LS.set('zette_pin',p);LS.set('zette_mode','cuisine');if(LS.get('zette_mode')!=='cuisine'){toast('Ce navigateur ne permet pas de mémoriser le mode cuisine');return}location.reload();return}
 if(t.id==='exitk'){if(($('#pinout').value||'')===LS.get('zette_pin')){LS.set('zette_mode','caisse');LS.del('zette_pin');location.reload()}else toast('Code incorrect');return}
 if(t.dataset.stready){const o=byId(t.dataset.stready);if(!o)return;try{const req=new Set();o.items.forEach(i=>(i.st||[STATION]).forEach(x=>req.add(x)));let pd=o.pd||[];if(B.fresh){try{const fs=await B.fresh(o.id);if(fs==='done')return;if(fs){const p=String(fs).split('+');if(p[0]==='ready')return;pd=p[1]?p[1].split(','):[]}}catch(e){}}const done=new Set(pd);if(STATION)done.add(STATION);const all=!STATION||[...req].every(x=>done.has(x));await B.status(o.id,all?'ready':'new+'+[...done].join(','))}catch(err){fail(err)}return}
 if(t.dataset.st){try{await B.status(t.dataset.id,t.dataset.st)}catch(err){fail(err)}return}
 if(t.id==='savem'){Object.keys(DEF).forEach(k=>cfg[k]=$('#m-'+k).value);try{await B.saveCfg(cfg);toast('Menu enregistré ✓')}catch(err){fail(err)}return}
 if(t.id==='wipe'){
  if(!t.dataset.sure){t.dataset.sure='1';t.textContent='Appuyez encore pour confirmer';setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent='Fin de journée : tout effacer'}},4000);return}
  try{await B.wipe();orders=[];t.textContent='Tout est effacé ✓';delete t.dataset.sure}catch(err){fail(err)}
  return}
});
(async()=>{ready=await B.init(onData);render()})();

</script></body></html>
