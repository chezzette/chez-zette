<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chez Zette – Caisse</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Caisse"><meta name="theme-color" content="#fde4ee">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

/* Chez Zette : fond rose clair, cartes blanches, turquoise pour l'action */
:root{
  --fond:#fde4ee; --surface:#ffffff; --encre:#1e1a1c; --gris:#6e5f67; --trait:#f1d3df; --trait-f:#e2bccb;
  --turq:#1f7f76; --turq-f:#17625b; --turq-c:#e3f1ef; --rose:#c2477c;
  --ambre:#a15c07; --ambre-c:#fdf0dc; --bleu:#1d5fbf; --bleu-c:#e5eefb; --rouge:#b42318; --rouge-c:#fdecea; --orange:#c4510b; --orange-c:#feeee2; --violet:#5b3fc4; --violet-c:#f0ecfd;
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--fond)}
body{margin:0;color:var(--encre);font:15px/1.45 var(--ui);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #7cc7bf;outline-offset:1px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--trait-f);background:var(--surface);border-radius:6px;padding:8px 12px;font-weight:600;font-size:14px;white-space:nowrap;min-height:38px}
.btn.p{background:var(--turq);border-color:var(--turq);color:#fff}
.btn.r{color:var(--rouge);border-color:#efb7b1}
.btn.o{color:var(--orange);border-color:#f0c49e}
.btn.ic{width:38px;padding:0}
.btn.g{width:100%;padding:13px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}
.photo{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#fdf1f6 0 10px,#f9e8ef 10px 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#a08f97;font-size:12px;font-weight:500;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--trait-f);background:var(--surface);border-radius:6px;padding:9px 12px;font-size:14px;min-height:40px}
.chip.on{border-color:var(--turq);background:var(--turq-c);color:var(--turq-f);font-weight:600}
.chip.off{opacity:.45;text-decoration:line-through;cursor:default}
.lab{font:700 12px/1.2 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--gris);margin:16px 0 8px;display:flex;justify-content:space-between;gap:8px}
.lab em{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none}
.step{display:inline-flex;align-items:center;gap:10px}
.step b{min-width:22px;text-align:center;font-size:17px}
.inp{width:100%;border:1px solid var(--trait-f);border-radius:6px;padding:11px 12px;font:15px var(--ui);background:var(--surface);color:var(--encre)}
.tag{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--ui);padding:5px 7px;border-radius:4px;border:1px solid;white-space:nowrap}
.t-cpt{color:#4a4146;border-color:#e2bccb;background:#fdf1f6}.t-web{color:var(--bleu);border-color:#b8cdee;background:var(--bleu-c)}
.tag.big{font:700 15px/1 var(--cond);letter-spacing:.04em;padding:7px 11px;border-radius:5px}
.tk .t-emp.big{background:var(--ambre);border-color:var(--ambre);color:#fff}
.t-sp{color:var(--turq-f);border-color:#b7dcd7;background:var(--turq-c)}.t-emp{color:var(--ambre);border-color:#efd3a8;background:var(--ambre-c)}
.t-la{color:#fff;border-color:var(--orange);background:var(--orange)}.t-mod{color:var(--violet);border-color:#cfc3f3;background:var(--violet-c)}
.st{font:600 12px/1 var(--ui);padding:5px 8px;border-radius:4px;white-space:nowrap}
.s-web{background:var(--bleu-c);color:var(--bleu)}.s-prep{background:var(--ambre-c);color:var(--ambre)}.s-ready{background:var(--turq-c);color:var(--turq-f)}.s-done{background:#eee8eb;color:var(--gris)}.s-off{background:var(--rouge-c);color:var(--rouge)}
.sum{font-size:13px;color:var(--gris);line-height:1.45}
.sum .sp{color:var(--turq-f);font-weight:700;font-size:14px}.sum .rt{color:var(--rouge);font-weight:700;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--encre);color:#fff;padding:11px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:calc(100% - 32px);text-align:center}
/* ---------- site client ---------- */
.cl{max-width:460px;margin:0 auto;min-height:calc(100vh - 52px);background:var(--fond);position:relative;padding-bottom:90px}
@media (min-width:600px){.cl{margin:18px auto;border:1px solid var(--trait-f);border-radius:20px;overflow:hidden;min-height:0}}
.cl .hd{background:var(--surface);padding:14px 16px 12px;border-bottom:1px solid var(--trait)}
.cl .hd .r{display:flex;gap:12px;align-items:center}.cl .hd img{width:46px;height:46px;border-radius:9px}
.cl .hd b{font-size:19px}.cl .hd .s{color:var(--gris);font-size:13px}
.cl .info{display:flex;gap:14px;flex-wrap:wrap;color:var(--gris);font-size:13px;margin-top:9px}.cl .info span{display:inline-flex;gap:5px;align-items:center}.cl .info svg.i{width:15px;height:15px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:5;display:flex;gap:7px;overflow-x:auto;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--trait);scrollbar-width:none}
.tabs button{border:1px solid var(--trait-f);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px;white-space:nowrap}
.tabs button.on{background:var(--encre);border-color:var(--encre);color:#fff}
.sec{padding:6px 16px}.sec h3{font-size:17px;margin:14px 0 8px}
.lp{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;background:var(--surface);border:1px solid var(--trait);border-radius:8px;padding:11px;margin-bottom:9px;text-align:left;width:100%}
.lp .photo{aspect-ratio:1;border-radius:6px}
.lp b{display:block;font-size:15px}.lp small{display:block;color:var(--gris);font-size:13px;line-height:1.35;margin:3px 0 7px}
.lp .px{font-weight:700;color:var(--turq-f)}.lp .ad{margin-left:10px;color:var(--turq-f);font-weight:600;font-size:13.5px;display:inline-flex;gap:3px;align-items:center}
.lp.off{opacity:.55;cursor:default}.lp.off .px{color:var(--rouge)}
.lp .qb{background:var(--turq);color:#fff;border-radius:4px;padding:2px 6px;font-size:12px;font-weight:700;margin-left:6px}
.cbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(428px,calc(100% - 32px));z-index:20;background:var(--turq);color:#fff;border:0;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;font-weight:700;font-size:15.5px;box-shadow:0 6px 18px rgba(31,127,118,.35)}
/* feuilles (fiche produit, panier) */
.ov{position:fixed;inset:0;z-index:40;background:rgba(30,26,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(560px,100%);max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:14px;max-height:90vh}}
.sheet .photo{aspect-ratio:16/9}
.sheet .c{padding:14px 18px 8px}
.sheet h2{margin:0;font-size:21px}.sheet .d{color:var(--gris);margin-top:3px}.sheet .pr{font-weight:700;color:var(--turq-f);margin-top:4px;font-size:16px}
.sheet .x{position:sticky;top:0;float:right;margin:10px 10px -48px 0;z-index:2;background:var(--surface);border-radius:50%;width:38px;height:38px;border:1px solid var(--trait-f);display:flex;align-items:center;justify-content:center}
.sheet .foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--trait);padding:12px 18px;display:flex;gap:12px;align-items:center}
.cline{padding:12px 0;border-bottom:1px solid var(--trait)}
.cline .h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.cline .a{display:flex;gap:6px;margin-top:8px}
/* confirmation */
.done{background:var(--surface);margin:16px;border-radius:12px;border:1px solid var(--trait);padding:20px 18px;text-align:center}
.done .n{font:700 52px/1.05 var(--cond)}
.ready{position:fixed;inset:0;z-index:55;background:var(--turq);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
.ready .n{font:700 64px/1 var(--cond)}
.ready p{max-width:30ch;font-size:19px;font-weight:600;margin:0}
.ready .btn{background:#fff;color:var(--turq-f);border:0;min-width:200px}
/* ---------- caisse ---------- */
.cs{min-height:calc(100vh - 52px);display:flex;flex-direction:column}
.cs .bar{display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--trait);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.cs .bar img{width:32px;height:32px;border-radius:6px}.cs .bar .sp{flex:1}
.cs .bar .tb{border:0;background:none;padding:8px 11px;border-radius:6px;font-weight:600;color:var(--gris);display:inline-flex;gap:6px;align-items:center}
.cs .bar .tb.on{background:var(--turq-c);color:var(--turq-f)}
.cnt{background:var(--bleu);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 7px}
.etat{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--turq-f);font-weight:600}.etat i{width:8px;height:8px;border-radius:50%;background:#2f9e44;display:block}
.pos{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.crumb{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-size:18px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.rail{background:var(--surface);border-right:1px solid var(--trait);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.rail button{border:0;background:none;text-align:left;padding:11px 12px;border-radius:6px;font-weight:600}
.rail button.on{background:var(--turq);color:#fff}
.prods{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;overflow:auto}
.pc{background:var(--surface);border:1px solid var(--trait);border-radius:8px;overflow:hidden;text-align:left;padding:0;position:relative;display:flex;flex-direction:column}
.pc .nm{padding:8px 10px 0;font-weight:600}.pc .px{padding:2px 10px 10px;font-weight:700;color:var(--turq-f)}
.pc.off{opacity:.5;cursor:default}.pc.off .px{color:var(--rouge)}
.pc .q{position:absolute;top:7px;right:7px;background:var(--turq);color:#fff;border-radius:4px;padding:3px 7px;font-weight:700;font-size:12.5px}
.cart{background:var(--surface);border-left:1px solid var(--trait);display:flex;flex-direction:column;min-height:0}
.cart .ch{padding:12px 14px;border-bottom:1px solid var(--trait);font-weight:700;display:flex;gap:8px;align-items:center}
.cart .cb{padding:0 14px;overflow:auto;flex:1}
.cart .cf{padding:12px 14px;border-top:1px solid var(--trait);display:grid;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--trait-f);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px;font-weight:600}.seg button.on{background:var(--turq);color:#fff}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:17px}
.empty{color:var(--gris);padding:24px 6px;text-align:center}
.pcats{display:none}
.pbar{display:none}
@media (max-width:899px){
  .pos{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .pcats{display:flex;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:5}
  .cart{display:none}
  .pbar{display:flex}
  .prods{padding-bottom:96px}
}
.list{padding:14px max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px));max-width:1100px;width:100%;margin:0 auto}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--trait-f);background:var(--surface);border-radius:6px;padding:8px 11px;font-weight:600;font-size:14px}
.filters button.on{background:var(--encre);border-color:var(--encre);color:#fff}
.oc{background:var(--surface);border:1px solid var(--trait);border-radius:8px;margin-bottom:10px;overflow:hidden}
.oc.la{border:2px solid var(--orange)}
.oc .h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--trait);flex-wrap:wrap}
.oc .no{font:700 20px/1 var(--cond)}
.oc .b{padding:10px 12px;display:grid;gap:8px}
.oc .it{display:flex;justify-content:space-between;gap:10px}
.oc .f{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--trait);flex-wrap:wrap}
.oc .f .acts{display:flex;gap:6px;flex-wrap:wrap}
.lock{max-width:360px;margin:40px auto;background:var(--surface);border:1px solid var(--trait);border-radius:12px;padding:22px;text-align:center}
.lock .pin{font:600 26px/1 var(--cond);letter-spacing:.4em;text-align:center}
table.v{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--trait);border-radius:8px;overflow:hidden}
table.v td,table.v th{padding:9px 12px;border-bottom:1px solid var(--trait);text-align:left;font-variant-numeric:tabular-nums}
table.v th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
table.v td.n{text-align:right}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi div{background:var(--surface);border:1px solid var(--trait);border-radius:8px;padding:12px 14px}.kpi b{display:block;font:700 26px/1.1 var(--cond)}
.reg h3{margin:18px 0 8px;font-size:16px}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph .pc{cursor:default}
.ph label{margin:0 10px 10px}
/* ---------- cuisine ---------- */
.kd{padding:10px max(10px,env(safe-area-inset-right,0px)) 40px max(10px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:760px;margin:0 auto;align-items:start}
.tk{background:var(--surface);border:1px solid var(--trait-f);border-radius:8px;overflow:hidden}
.tk.la{border:2px solid var(--orange)}
.tk.rdy{border-left:6px solid var(--turq)}.tk.rdy .th{background:var(--turq-c)}
.tk .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 10px;border-bottom:1px solid var(--trait);background:#fdf6f9}
.tk .no{font:700 20px/1 var(--cond)}
.tk .tags{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px 0}
.art{padding:7px 10px;border-top:1px solid var(--trait)}
.tk .tags+.art{border-top:0}
.art .t{font:700 15px/1.2 var(--cond);text-transform:uppercase;letter-spacing:.02em;display:flex;gap:7px;align-items:center}
.art .t .qx{font:700 16px/1 var(--cond);color:var(--encre);background:#f3e6ec;border-radius:4px;padding:3px 7px;white-space:nowrap}
.rub{margin:4px 0 0;display:grid;grid-template-columns:76px minmax(0,1fr);gap:1px 6px;font-size:13.5px;line-height:1.35}
.rub dt{font:600 10px/1.9 var(--ui);letter-spacing:.05em;text-transform:uppercase;color:var(--gris)}.rub dd{margin:0}
.rub.sup,.rub.ret{border-radius:5px;padding:6px 8px;margin-top:6px;grid-template-columns:minmax(0,1fr);gap:1px}
.rub.sup dt:not(:first-of-type),.rub.ret dt:not(:first-of-type){display:none}
.rub.sup dt,.rub.ret dt{font:700 10.5px/1.6 var(--ui);letter-spacing:.07em}
.rub.sup dd,.rub.ret dd{font:700 18px/1.25 var(--cond);letter-spacing:.01em}
.rub.sup{background:var(--turq-c);border-left:5px solid var(--turq)}
.rub.sup dt{color:var(--turq-f)}.rub.sup dd{color:var(--turq-f)}.rub.sup dd::before{content:"+ "}
.rub.ret{background:var(--rouge-c);border-left:5px solid var(--rouge)}
.rub.ret dt{color:var(--rouge)}.rub.ret dd{color:var(--rouge)}.rub.ret dd::before{content:"Sans "}
.rq{margin:6px 0 0;padding:6px 8px;border-radius:5px;border-left:5px solid var(--rouge);background:var(--rouge-c);color:var(--rouge);font:700 18px/1.25 var(--cond);letter-spacing:.01em}.rq b{font:700 10.5px/1.6 var(--ui);letter-spacing:.07em;text-transform:uppercase;display:block;color:var(--rouge)}
.tk .tf{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 10px;border-top:1px solid var(--trait)}
.tk .tf .btn{min-height:34px;padding:6px 12px}
.kbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--trait);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.kbar img{width:32px;height:32px;border-radius:6px}

/* ---- ajouts version réelle ---- */
#app{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-top:env(safe-area-inset-top,0px);min-height:100vh}
.etat.off{color:var(--rouge)}.etat.off i{background:var(--rouge)}
.bans{display:grid;gap:8px;padding:0 12px}.bans:not(:empty){padding:10px 12px 0}
.banner{display:flex;flex-direction:column;gap:8px;border-radius:8px;padding:11px 14px;font-weight:600;border:1px solid;text-align:left;width:100%}
button.banner{flex-direction:row;align-items:center}
.banner .h{display:flex;gap:8px;align-items:center}
.banner .r{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:6px;padding:6px 8px 6px 10px;font-weight:500}
.b-web{background:var(--bleu-c);border-color:#b8cdee;color:var(--bleu)}
.b-al{background:var(--ambre-c);border-color:#f0cf9a;color:var(--ambre)}
.b-ok{background:var(--surface);border-color:var(--trait-f);color:var(--encre);flex-direction:row;align-items:center;justify-content:space-between}
.editban{display:flex;align-items:center;gap:10px;background:var(--violet-c);color:var(--violet);border-bottom:1px solid #cfc3f3;padding:10px 14px;font-weight:500}
.editban span{flex:1}
.dupw{color:var(--orange);font-size:13px;font-weight:600}.dupw:empty{display:none}
.login{max-width:340px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--trait);border-radius:14px;padding:26px 22px;text-align:center;display:grid;gap:12px}
.login img{width:84px;height:84px;border-radius:16px;margin:0 auto}.login h1{margin:0;font-size:24px}.login p{margin:0;color:var(--gris)}
.login .pin,.inp.pin{font:600 24px/1 var(--cond);letter-spacing:.3em;text-align:center}
.msg{max-width:420px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--trait);border-radius:12px;padding:22px;text-align:center}
.reg .gl{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.reg .hint{color:var(--gris);font-size:13px;margin:0 0 6px}
.reg textarea.ta{font:13.5px/1.45 ui-monospace,Menlo,monospace;min-height:110px;resize:vertical}
.give{min-height:30px;padding:3px 9px;font-size:13px;margin-left:auto;color:var(--turq-f);border-color:#9fd0ca}
.ck{width:18px;height:18px;border:2px solid var(--trait-f);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:#fff}

// ===== Caisse et cuisine : connexion à Supabase (avec code) =====
let sb=null;
const ck=r=>{if(r.error){B.online=navigator.onLine!==false&&!/fetch|network/i.test(r.error.message||'')?true:false;throw r.error}B.online=true;return r};
const B={online:true,
 async init(cb){B.cb=cb;
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'zette-auth-'+MODE}});
  const {data}=await sb.auth.getSession();if(data&&data.session){B.start();return true}return false},
 async signin(code){const r=await sb.auth.signInWithPassword({email:EMAIL,password:code});if(r.error)return false;B.start();return true},
 async load(){try{
  if(MODE==='caisse'){try{await sb.rpc('zette_cleanup')}catch(e){}}
  const o=await sb.from('orders').select('*').order('created_at');if(o.error)throw o.error;
  const d={orders:o.data.map(r=>({...r,total:+r.total}))};
  if(MODE==='caisse'){const c=await sb.from('config').select('data').eq('id',1).maybeSingle();if(!c.error&&c.data)d.cfg=c.data.data;
   const r=await sb.from('zette_runs').select('*').order('target',{ascending:false}).limit(7);if(!r.error)d.runs=r.data}
  B.online=true;B.cb(d)}catch(e){B.online=false}},
 async loadPhotos(){const r=await sb.from('photos').select('name,data');if(!r.error&&r.data){const m={};r.data.forEach(x=>m[x.name]=x.data);B.cb({photos:m})}},
 start(){if(B.started)return;B.started=true;B.load();if(MODE==='caisse')B.loadPhotos();
  const f=()=>B.load();
  sb.channel('chez-zette-'+MODE+STATION).on('postgres_changes',{event:'*',schema:'public',table:'orders'},f).on('postgres_changes',{event:'*',schema:'public',table:'config'},f).subscribe();
  setInterval(f,15000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')f()})},
 async send(o){ck(await sb.from('orders').insert(o));B.load()},
 async fresh(id){const r=await sb.from('orders').select('status').eq('id',id).maybeSingle();if(r.error)throw r.error;return r.data?r.data.status:null},
 async status(id,st){ck(await sb.from('orders').update({status:st}).eq('id',id));B.load()},
 async update(id,patch){ck(await sb.from('orders').update(patch).eq('id',id));B.load()},
 async saveCfg(c){ck(await sb.from('config').upsert({id:1,data:c}))},
 async savePhoto(n,d){ck(await sb.from('photos').upsert({name:n,data:d}))},
 async delPhoto(n){ck(await sb.from('photos').delete().eq('name',n))},
 async wipe(){ck(await sb.from('orders').delete().gte('id',0));B.load()}
};

// ===== Chez Zette v2 : code commun (caisse, cuisine, site client) =====
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>(Math.round((+n||0)*100)/100).toFixed(2).replace('.',',')+' €';
const lines=t=>String(t||'').split('\n').map(s=>s.trim()).filter(Boolean);
const num=v=>parseFloat(String(v||'0').replace(',','.'))||0;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const ic=(n,st)=>`<svg class="i"${st?` style="${st}"`:''}><use href="#i-${n}"/></svg>`;

/* ---------- menu ---------- */
const DEFCFG={cat:'',sauces:'',garnitures:'',viandes:'',plats:'',boissons:'',supps:'',bases:'',rupt:'',cleanup:'00:00',vcode:''};
let CFG={...DEFCFG},CATS=[],L={sauce:[],garn:[],viande:[],plat:[],boisson:[]},SUPP=[];
function parseOpts(s){return s.split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const [k,v]=x.split(':');return{k:k.trim(),only:v?v.split('/').map(z=>z.trim()):null}})}
function setCfg(d){CFG={...DEFCFG,...(d||{})};CATS=[];let c=null;
  lines(CFG.cat).forEach(l=>{if(l.startsWith('##')){const p=l.slice(2).split('|');c={name:p[0].trim(),opts:parseOpts(p[1]||''),items:[]};CATS.push(c)}else if(c){const a=l.split(';');c.items.push({name:a[0].trim(),price:num(a[1]),desc:a.slice(2).join(';').trim()})}});
  L={sauce:lines(CFG.sauces),garn:lines(CFG.garnitures).filter(n=>!/^sans/i.test(n)),viande:lines(CFG.viandes),plat:lines(CFG.plats),boisson:lines(CFG.boissons)};
  SUPP=lines(CFG.supps).map(l=>{const a=l.split(';');return{n:a[0].trim(),p:num(a[1])}})}
const has=(c,k)=>!!c&&c.opts.some(o=>o.k===k);const opt=(c,k)=>c&&c.opts.find(o=>o.k===k);
const SP=n=>{const x=SUPP.find(y=>norm(y.n)===norm(n));return x?x.p:(/garniture/i.test(n)?1:/viande/i.test(n)?3:0)};
const TPLUS=3;
const RUPT=()=>new Set(lines(CFG.rupt));
const off=(kind,n)=>RUPT().has(kind+':'+n);
const RMV=/salade|tomate|oignon|poivron|cheddar|bacon|œuf|oeuf|pesto|mozza|guacamole|miel|jambon/i;
function retList(it){const t=(it.desc||'').split(/,|\+|\(|\)/).map(x=>x.trim()).filter(x=>x&&RMV.test(x));const l=t.map(x=>'Sans '+x.charAt(0).toLowerCase()+x.slice(1));if(t.some(x=>/salade/i.test(x))&&t.some(x=>/tomate/i.test(x)))l.push('Sans crudités');return [...new Set(l)]}
function ajoutList(it){const d=norm(it.desc||'');return L.garn.filter(n=>{const w=norm(n).split(/\s+/)[0];return !(d&&w&&d.includes(w))&&!SUPP.some(x=>norm(x.n)===norm(n))})}
function suppList(c){const o=opt(c,'supp');if(!o)return [];let l=SUPP;if(o.only)l=l.filter(x=>o.only.some(w=>norm(w)===norm(x.n)));if(has(c,'viande'))l=l.filter(x=>!/viande|garniture/i.test(x.n));if(has(c,'ajout'))l=l.filter(x=>!/garniture/i.test(x.n));return l}
const findIt=(cn,inm)=>{const c=CATS.find(x=>x.name===cn);return {c,it:c&&c.items.find(i=>i.name===inm)}};
const newSel=()=>({qty:1,label:'',apart:false,gs:{},gopen:false,retire:[],ajout:[],viande:'',garn:[],vs:{},supp:[],sauce:[],plat:'',boisson:'',plus:0,note:''});
function unit(c,it,s){const sum=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);let p=it.price+(s.ajout.length+sum(s.gs))*SP('Garniture')+sum(s.vs)*SP('Viande')+s.plus*TPLUS;s.supp.forEach(n=>p+=SP(n));return Math.round(p*100)/100}
// rubriques enregistrées DANS la commande : la cuisine affiche exactement ce qui a été choisi
function rubrics(c,it,s){const r=[];const tac=has(c,'viande'),enf=has(c,'enfant');
  if(tac&&s.viande)r.push(['n','Viande',[s.viande]]);
  if(tac&&s.garn.length)r.push(['n','Garnitures',s.garn]);
  const sup=[];Object.entries(s.vs).forEach(([m,n])=>{if(n>0)sup.push('Viande : '+m+(n>1?' ×'+n:''))});Object.entries(s.gs||{}).forEach(([g,n])=>{if(n>0)sup.push('Garniture : '+g+(n>1?' ×'+n:''))});s.supp.forEach(x=>sup.push(x));s.ajout.forEach(x=>sup.push(x));if(s.plus)sup.push(s.plus+' tender'+(s.plus>1?'s':'')+' en plus');
  if(sup.length)r.push(['sup','Suppléments',sup]);
  if(s.sauce.length)r.push(['n',s.apart?'Sauces à part':'Sauces',s.sauce]);
  if(s.retire.length)r.push(['ret','À retirer',s.retire.map(x=>x.replace(/^sans\s+/i,''))]);
  if(enf&&s.boisson)r.push(['drink','Boisson',[s.boisson]]);
  return r}
function makeLine(c,it,s){const qty=s.qty||1,sel={...s,qty:1,gopen:false};const lb=(s.label||'').trim();
  return {cn:c.name,inm:it.name,name:it.name+(lb?' « '+lb+' »':''),kn:has(c,'enfant')&&s.plat?'Menu enfant '+(/croque/i.test(s.plat)?'croque':'nuggets'):'',sel,qty,unit:unit(c,it,sel),rub:rubrics(c,it,sel)}}
function sumHTML(l){if(!l.rub)return l.detail?`<div class="sum">${esc(l.detail)}</div>`:'';
  const p=l.rub.map(([k,lab,v])=>k==='sup'?`<span class="sp">${v.map(x=>'+ '+esc(x)).join(', ')}</span>`:k==='ret'?`<span class="rt">${v.map(x=>'Sans '+esc(x)).join(', ')}</span>`:esc(v.join(', '))+(lab==='Sauces à part'?' <b>(à part)</b>':''));
  if(l.sel&&l.sel.plat)p.unshift(esc(l.sel.plat));if(l.sel&&l.sel.note)p.push('<span class="rt">Remarque : '+esc(l.sel.note)+'</span>');return p.length?`<div class="sum">${p.join(' · ')}</div>`:''}

/* ---------- postes ---------- */
function stationsFor(cat,item,plat){const c=norm(cat),n=norm(item),p=norm(plat);if(/boisson/.test(c))return[];if(/hot ?dog|corn ?dog/.test(c))return['1'];if(/frite/.test(c))return['1','2'];if(/wrap|tacos/.test(c))return['2','3'];if(/burger|burgeur|americain|tender|nugget/.test(c))return['2'];if(/panini/.test(c))return /carnivor|fermier/.test(n)?['2','3']:['3'];if(/croque/.test(c))return['3'];if(/enfant/.test(c))return /croque/.test(p)?['3']:['2'];return['1','2','3']}
const isFr=l=>/frite/.test(norm(l.cn||l.name));
const lSt=l=>stationsFor(l.cn||'',l.inm||l.name||'',(l.sel&&l.sel.plat)||'');
function itemSt(o,l){if(!isFr(l))return lSt(l);const others=o.items.filter(x=>!isFr(x)&&lSt(x).length);const ost=others.flatMap(lSt);
  const st=new Set(['2']);if(!others.length||others.some(x=>/hot ?dog|corn ?dog/.test(norm(x.cn))))st.add('1');if(ost.includes('3'))st.add('3');return [...st].sort()}

/* ---------- statut : base[+postes prêts][#articles donnés] ---------- */
function parseSt(raw){const [a,g]=String(raw||'new').split('#');const p=a.split('+');return {base:p[0],pd:p[1]?p[1].split(',').filter(Boolean):[],gv:g?g.split(',').filter(x=>x!=='').map(Number):[]}}
const fmtSt=x=>x.base+(x.base==='new'&&x.pd.length?'+'+x.pd.join(','):'')+(x.gv.length?'#'+x.gv.join(','):'');
const OFF=s=>s==='refused'||s==='deleted';
const isGiven=(o,k)=>(o.gv||[]).includes(k)||!!(o.items[k]&&o.items[k].gv);
const needSt=o=>{const n=new Set();o.items.forEach((l,k)=>{if(!isGiven(o,k))itemSt(o,l).forEach(x=>n.add(x))});return n};
async function writeSt(o,mut){let raw=o.raw||o.status;if(B.fresh){try{const fs=await B.fresh(o.id);if(fs==null)return;raw=fs}catch(e){}}
  const x=parseSt(raw);if(x.base==='done'||x.base==='web'||OFF(x.base))return;mut(x);
  if(x.base==='new'){const need=needSt({...o,gv:x.gv});if([...need].every(y=>x.pd.includes(y)))x.base='ready'}
  await B.status(o.id,fmtSt(x))}

let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(n){try{unlockAudio();const t0=actx.currentTime+0.05;for(let i=0;i<n;i++)[880,1175,1568].forEach((f,j)=>{const o=actx.createOscillator(),g=actx.createGain(),st=t0+i*1.1+j*0.18;o.type='square';o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(0.3,st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,st+0.16);o.start(st);o.stop(st+0.18)})}catch(e){}}

function openSheet(cn,inm,editIdx){const Y=X();const {c,it}=findIt(cn,inm);if(!it){toast('Article introuvable dans le menu');return}if(off('i',inm)){toast(inm+' est indisponible');return}

function chipBtns(k,list,s,multi,price){return list.map(x=>{const n=typeof x==='string'?x:x.n,p=typeof x==='string'?(price||0):x.p;const on=multi?s[k].includes(n):s[k]===n;
  return off('o',n)?`<button class="chip off" disabled>${esc(n)}</button>`:`<button class="chip ${on?'on':''}" data-a="${multi?'tog':'one'}" data-k="${k}" data-v="${esc(n)}">${esc(n)}${p?' +'+eur(p):''}</button>`}).join('')}
const chips=(k,list,s,multi,price)=>`<div class="chips">${chipBtns(k,list,s,multi,price)}</div>`;
const stepRow=(a,name,val)=>`<div class="srow"><span>${esc(name)}</span><span class="step"><button class="btn ic" data-a="${a}" data-v="${esc(name)}" data-d="-1" aria-label="moins">${ic('minus')}</button><b>${val||0}</b><button class="btn ic" data-a="${a}" data-v="${esc(name)}" data-d="1" aria-label="plus">${ic('plus')}</button></span></div>`;

  if(has(c,'enfant'))h+=`<div class="lab">Plat <em>avec frites, obligatoire</em></div>${chips('plat',L.plat,s,0)}`;

const WEBST0=['s-done','Commande terminée'];const WEBST={web:['s-web','En attente de validation par le snack'],new:['s-prep','En préparation'],ready:['s-ready','Prête, venez la chercher au comptoir'],done:['s-done','Récupérée, bon appétit !'],refused:['s-off','Refusée : renseignez-vous au comptoir'],deleted:['s-off','Annulée : renseignez-vous au comptoir']};

const hidMap=()=>LS.get(hidKey,{});
const isHidden=o=>{const h=hidMap();return h[o.id]!==undefined&&h[o.id]===(o.rev||0)};
function ktagsHTML(o){const t=[];if(o.arrived&&o.origin==='web')t.push(`<span class="tag t-la">${ic('user','width:13px;height:13px')}Client là ${hm(o.arrived)}</span>`);if(o.takeaway)t.push(`<span class="tag t-emp big">${ic('bag','width:16px;height:16px')}À EMPORTER</span>`);if(o.origin==='web')t.push(`<span class="tag t-web">${ic('globe','width:13px;height:13px')}En ligne</span>`);if(o.rev)t.push(`<span class="tag t-mod">Modifiée${o.updatedAt?' '+hm(o.updatedAt):''}</span>`);return t.join('')}
function cuisineHTML(){const K=S.cuisine,P=STATION;
  const vis=(o,l,k)=>{if(isGiven(o,k))return false;const st=itemSt(o,l);return P===''?st.length>0:st.includes(P)};
  const doneHere=o=>o.status==='ready'||(P!==''&&o.pd.includes(P));
  const active=sortO(S.orders.filter(o=>(o.status==='new'||o.status==='ready')&&o.items.some((l,k)=>vis(o,l,k))));
  const cours=active.filter(o=>!isHidden(o)),ret=active.filter(isHidden);const L2=K.tab==='cours'?cours:ret;
  let h=`<div class="kbar"><img src="${LOGO}" alt=""><b>${POSTES[P]}</b><span style="flex:1"></span><button class="btn ${K.tab==='cours'?'p':''}" data-a="ktab" data-k="cours">En cours (${cours.length})</button><button class="btn ${K.tab==='ret'?'p':''}" data-a="ktab" data-k="ret">Retirées (${ret.length})</button>${etatHTML()}</div>`;
  h+=`<div class="kd">${L2.length?L2.map(o=>{const its=o.items.map((l,k)=>[l,k]).filter(([l,k])=>vis(o,l,k));const rdy=doneHere(o);const kt=ktagsHTML(o);
    return `<div class="tk ${o.arrived&&o.origin==='web'?'la':''} ${rdy?'rdy':''}"><div class="th"><span><span class="no">N° ${o.num}</span> <b>${esc(o.name)}</b></span><span style="color:var(--gris);font-size:13px">${Math.max(1,Math.round((Date.now()-o.createdAt)/60000))} min</span></div>
    ${kt?`<div class="tags">${kt}</div>`:''}
    ${its.map(([l,k])=>{const r=(l.rub||[]).filter(x=>x[0]!=='drink');return `<div class="art ${l.chg?'chg':''}"><div class="t"><span>${esc(l.kn||l.name)}</span><span class="qx">×${l.qty}</span>${l.chg?'<span class="tag t-mod">Modifié</span>':''}${isFr(l)&&K.tab==='cours'&&!rdy?`<button class="btn give" data-a="give" data-id="${o.id}" data-i="${k}">${ic('check','width:14px;height:14px')}Donnée</button>`:''}</div>
      ${r.map(([kk,lab,v])=>`<dl class="rub ${kk==='sup'?'sup':kk==='ret'?'ret':''}">${v.map((x,i)=>`<dt>${i?'':esc(lab)}</dt><dd>${esc(x)}</dd>`).join('')}</dl>`).join('')}${!l.rub&&l.detail?`<div class="sum">${esc(l.detail)}</div>`:''}${l.sel&&l.sel.note?`<div class="rq"><b>Remarque</b>${esc(l.sel.note)}</div>`:''}</div>`}).join('')}
    ${o.note?`<div class="art"><div class="rq" style="margin:0"><b>Remarque de la commande</b>${esc(o.note)}</div></div>`:''}
    <div class="tf"><span class="sum">${rdy?'<span class="st s-ready">Prête</span>':hm(o.createdAt)}</span>${K.tab==='ret'?`<button class="btn" data-a="kshow" data-id="${o.id}">${ic('undo')}Remettre sur cet écran</button>`:rdy?`<button class="btn" data-a="khide" data-id="${o.id}">${ic('x')}Retirer de cet écran</button>`:`<button class="btn p" data-a="kready" data-id="${o.id}">${ic('check')}Prête</button>`}</div></div>`}).join(''):`<div class="empty" style="grid-column:1/-1">${K.tab==='cours'?'Rien à préparer pour l\'instant':'Aucune commande retirée de cet écran'}</div>`}</div>`;
  return h}

/* ====================== CONNEXION ====================== */
function loginHTML(){const t=MODE==='caisse'?'Caisse':POSTES[STATION];if(B.loginHTML){const x=B.loginHTML();if(x)return x}if(MODE==='client')return `<div class="msg">Chargement…</div>`;
  return `<div class="login"><img src="${LOGO}" alt="Logo Chez Zette"><h1>Chez Zette</h1><p>${esc(t)}</p><input class="inp pin" id="code" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Code" aria-label="Code d'accès"><button class="btn p g" data-a="login">Entrer</button></div>`}

/* ====================== RENDU ====================== */
function draw(){const app=$('#app');if(!app)return;
  const ae=document.activeElement,fid=ae&&ae.id&&['INPUT','TEXTAREA'].includes(ae.tagName)?ae.id:null,ss=fid&&ae.selectionStart;
  let h;if(!S.ready)h=loginHTML();else if(MODE==='client')h=clientHTML();else if(MODE==='caisse')h=caisseHTML();else h=cuisineHTML();
  if(S.ready&&MODE!=='cuisine')h+=sheetHTML();
  if(MODE==='client'&&S.showReady&&S.client.mine)h+=`<div class="ready" role="alertdialog"><svg class="i" style="width:64px;height:64px"><use href="#i-check"/></svg><div class="n">N° ${esc(S.client.mine.num)}</div><p>Votre commande est prête ! Vous pouvez venir la récupérer au snack. Merci pour votre commande.</p><button class="btn g" data-a="readyok">OK</button></div>`;
  if(S.toast)h+=`<div class="toast" role="status">${esc(S.toast)}</div>`;
  // garder la position de défilement (fiche produit, liste, panier, page) pendant la mise à jour de l'écran
  const keyOf=el=>{const c=(el.className&&el.className.baseVal==null?el.className:'')||el.tagName;return c+'|'+[...app.querySelectorAll('.'+String(c).trim().split(/\s+/).join('.'))].indexOf(el)};
  const keep=[];app.querySelectorAll('*').forEach(el=>{if(el.scrollTop>0||el.scrollLeft>0){try{keep.push([keyOf(el),el.scrollTop,el.scrollLeft])}catch(e){}}});
  const wx=scrollX,wy=scrollY;
  app.innerHTML=h;
  keep.forEach(([k,t,l])=>{const [c,i]=k.split('|');try{const el=[...app.querySelectorAll('.'+c.trim().split(/\s+/).join('.'))][+i];if(el){el.scrollTop=t;el.scrollLeft=l}}catch(e){}});
  if(wx||wy)window.scrollTo(wx,wy);
  if(fid){const el=document.getElementById(fid);if(el&&el.tagName==='INPUT'){el.focus();try{el.setSelectionRange(ss,ss)}catch(e){}}}}
function onData(d){if(d.cfg)setCfg(d.cfg);if(d.photos)S.photos={...d.photos};if(d.runs)S.runs=d.runs;
  if(d.orders){S.orders=d.orders.map(o=>{const x=parseSt(o.status);return {...o,raw:o.status,status:x.base,pd:x.pd,gv:x.gv,createdAt:Date.parse(o.created_at||o.createdAt)||Date.now(),updatedAt:o.updated_at?Date.parse(o.updated_at):null,arrived:o.arrived?Date.parse(o.arrived):null,origin:o.origin||((o.token||'')?'web':'cpt'),items:(o.items||[]).map(l=>({...l,qty:+l.qty||1,unit:+(l.unit!=null?l.unit:l.price)||0}))}});
    if(MODE==='caisse'){const web=S.orders.filter(o=>o.status==='web').map(o=>o.id);if(S.seenWeb&&web.some(id=>!S.seenWeb.includes(id)))beep(2);S.seenWeb=web}}
  S.ready=true;
  const busy=(MODE!=='cuisine'&&X().sheet)||['INPUT','TEXTAREA'].includes((document.activeElement||{}).tagName);
  if(busy&&MODE==='caisse'&&S.caisse.tab!=='reg'){const b=$('.bans');if(b)b.innerHTML=bannersHTML();return}
  if(busy&&MODE!=='caisse')return;
  if(MODE==='caisse'&&S.caisse.tab==='reg'&&['INPUT','TEXTAREA'].includes((document.activeElement||{}).tagName))return;
  draw()}

/* ====================== ACTIONS ====================== */
document.addEventListener('input',e=>{const t=e.target,Y=X();
  if(t.id==='inote'&&Y.sheet)Y.sheet.sel.note=t.value;else if(t.id==='tlabel'&&Y.sheet)Y.sheet.sel.label=t.value;
  else if(t.id==='cname'){Y.name=t.value;if(MODE==='caisse'){S.caisse.dupAck='';const w=$('#dupw');const d=dupFind();if(w)w.innerHTML=d?dupTxt(d):''}}
  else if(t.id==='cnote')Y.note=t.value;else if(t.id==='pin')S.caisse.pin=t.value});
document.addEventListener('change',async e=>{const t=e.target;if(t.type==='file'&&t.files&&t.files[0]&&B.savePhoto){const n=t.dataset.n,f=t.files[0];
  try{toast('Enregistrement de la photo…');const url=URL.createObjectURL(f);const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});const M=640,k=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    const d=cv.toDataURL('image/jpeg',.78);await B.savePhoto(n,d);S.photos[n]=d;toast('Photo enregistrée')}catch(err){fail(err)}}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(id==='code')go('login',e.target);else if(id==='pin')go('unlock',e.target)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;if(t.dataset.a==='closesheet'||t.dataset.a==='closepanel'){if(e.target.closest('[data-stop]')&&!e.target.closest('.x'))return}go(t.dataset.a,t)});
async function go(a,t){const Y=X(),d=t.dataset;
  switch(a){
  case 'login':{const v=($('#code')||{}).value||'';if(!v)return;t.disabled=true;const ok=await B.signin(v);if(!ok){toast('Code incorrect');t.disabled=false}return}
  case 'goto':{const i=+d.i;S.client.active=i;draw();const el=document.getElementById('cat'+i);if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-60,behavior:'smooth'});return}
  case 'open':openSheet(d.c,d.n);return;
  case 'closesheet':Y.sheet=null;break;
  case 'closepanel':Y.panel=false;break;
  case 'cpanel':Y.panel=true;break;
  case 'tog':{const s=Y.sheet.sel,k=d.k,v=d.v;const i=s[k].indexOf(v);i>=0?s[k].splice(i,1):s[k].push(v);break}
  case 'one':{const s=Y.sheet.sel;s[d.k]=s[d.k]===d.v?'':d.v;break}
  case 'vs':{const s=Y.sheet.sel;s.vs[d.v]=Math.max(0,(s.vs[d.v]||0)+(+d.d));break}
  case 'gs':{const s=Y.sheet.sel;s.gs[d.v]=Math.max(0,(s.gs[d.v]||0)+(+d.d));break}
  case 'gopen':{const s=Y.sheet.sel;s.gopen=!s.gopen;break}
  case 'apart':{const s=Y.sheet.sel;s.apart=!s.apart;break}
  case 'plus':{const s=Y.sheet.sel;s.plus=Math.max(0,s.plus+(+d.d));break}
  case 'qty':{const s=Y.sheet.sel;s.qty=Math.max(1,s.qty+(+d.d));break}
  case 'addit':{const sh=Y.sheet,{c,it}=findIt(sh.cn,sh.inm),s=sh.sel;if(has(c,'viande')&&!s.viande){toast('Choisissez la viande');return}if(has(c,'enfant')&&!s.plat){toast('Choisissez le plat');return}
    addLine(Y,makeLine(c,it,s),sh.editIdx);Y.sheet=null;if(MODE==='caisse'&&sh.editIdx==null)S.caisse.cat=null;toast(it.name+(sh.editIdx!=null?' modifié':' ajouté'));return}
  case 'cinc':Y.cart[+d.i].qty++;break;
  case 'cdec':{const l=Y.cart[+d.i];l.qty>1?l.qty--:Y.cart.splice(+d.i,1);break}
  case 'cdel':Y.cart.splice(+d.i,1);break;
  case 'cedit':{const l=Y.cart[+d.i];Y.panel=false;openSheet(l.cn,l.inm,+d.i);return}
  /* site client */
  case 'order':{const C=S.client;if(!C.cart.length||C.sending)return;if(!C.name.trim()){toast('Entrez votre prénom');const i=$('#cname');if(i)i.focus();return}
    armAlert();C.ref=C.ref||(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));C.sending=true;draw();
    const items=cleanItems(C.cart),total=cartTotal(C);
    try{const r=await B.send({name:C.name.trim(),items,note:C.note.trim(),ref:C.ref});C.mine={id:r.id,num:r.num,token:r.token,day:r.day||getDay(),name:C.name.trim(),items,total,arrived:null};LS.set('zette_web2',C.mine);
      C.cart=[];C.name='';C.note='';C.panel=false;C.ref=null;C.view='suivi';webSt='web';pollWeb();scrollTo(0,0);toast('Commande envoyée au snack')}catch(err){fail(err)}
    C.sending=false;break}
  case 'suivi':S.client.view='suivi';pollWeb();break;
  case 'neworder':S.client.view='menu';break;
  case 'armalert':armAlert();break;
  case 'arrive':{const m=S.client.mine;try{await B.arrive(m.id,m.token);m.arrived=Date.now();LS.set('zette_web2',m);toast('Le snack est prévenu que vous êtes là')}catch(err){fail(err)}break}
  case 'readyok':S.showReady=false;document.title='Chez Zette – Commander';break;
  /* caisse */
  case 'ctab':if(d.k!=='ventes')S.ventesOK=false;S.caisse.tab=d.k;break;
  case 'ccat':{const k=CATS[+d.i];if(k.items.length===1){openSheet(k.name,k.items[0].name);return}S.caisse.cat=+d.i;break}
  case 'cback':S.caisse.cat=null;break;
  case 'mode':S.caisse.mode=d.k;break;
  case 'gotoweb':S.caisse.tab='cmd';S.caisse.filter='web';break;
  case 'filt':S.caisse.filter=d.k;break;
  case 'runseen':LS.set('zette_runseen',d.k);break;
  case 'send':{const C=S.caisse;if(!C.cart.length||C.sending)return;if(!C.name.trim()){toast('Entrez le prénom du client');const i=$('#cname');if(i)i.focus();return}
    const items=cleanItems(C.cart),total=cartTotal(C);
    if(C.edit){const o=byId(C.edit);if(!o){toast('Commande introuvable');C.edit=null;break}
      const key=l=>JSON.stringify([l.name,l.sel,l.qty]);const before=new Set(o.items.map(key));const its=items.map(l=>before.has(key(l))?{...l,chg:false}:{...l,chg:true});
      const changed=its.length!==o.items.length||its.some(l=>l.chg);
      C.sending=true;draw();
      try{await B.update(o.id,{items:its,total,name:C.name.trim(),note:C.note.trim(),takeaway:C.mode==='emp',rev:(o.rev||0)+1,updated_at:new Date().toISOString(),...(changed?{status:'new'}:{})});leaveEdit();C.tab='cmd';C.filter='cours';toast('Commande N° '+o.num+' modifiée')}catch(err){fail(err)}
      C.sending=false;break}
    const dn=C.name.trim().toLowerCase();if(dupFind()&&C.dupAck!==dn){C.dupAck=dn;toast('Ce prénom a déjà une commande récente : touchez Envoyer une 2e fois pour confirmer');return}
    C.sending=true;draw();
    try{await B.send({day:getDay(),name:C.name.trim(),items,total,note:C.note.trim(),takeaway:C.mode==='emp',origin:'cpt',status:'new'});C.cart=[];C.name='';C.note='';C.mode='sp';C.panel=false;C.dupAck='';C.cat=null;toast('Commande envoyée en préparation')}catch(err){fail(err);toast('Pas envoyée : vérifiez la connexion puis réessayez. Le panier est gardé.')}
    C.sending=false;break}
  case 'editord':{const o=byId(d.id);if(!o)return;const C=S.caisse;if(!C.edit)C.held={cart:C.cart,name:C.name,note:C.note,mode:C.mode};
    C.edit=o.id;C.cart=o.items.map((l,k)=>({...l,gv:isGiven(o,k)||undefined}));C.name=o.name;C.note=o.note||'';C.mode=o.takeaway?'emp':'sp';C.tab='prise';C.cat=null;break}
  case 'canceledit':leaveEdit();break;
  case 'ost':{const o=byId(d.id);try{await B.status(d.id,fmtSt({base:d.s,pd:[],gv:(o&&o.gv)||[]}));toast({new:'Commande remise en cours',done:'Commande récupérée'}[d.s]||'C\'est fait')}catch(err){fail(err)}return}
  case 'accept':{const o=byId(d.id);if(!o)return;const items=o.items.map(l=>{const {c,it}=findIt(l.cn,l.inm);if(!it||!l.sel)return l;const u=unit(c,it,l.sel);return {...l,unit:u,rub:rubrics(c,it,l.sel)}});const total=items.reduce((a,l)=>a+l.unit*l.qty,0);
    try{await B.update(o.id,{items,total,status:'new'});toast('Commande N° '+o.num+' envoyée en préparation')}catch(err){fail(err)}return}
  case 'refuse':{if(!d.sure){t.dataset.sure='1';t.textContent='Sûr ? Retouchez';setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent='Refuser'}},4000);return}try{await B.status(d.id,'refused');toast('Commande refusée (récupérable dans « Annulées »)')}catch(err){fail(err)}return}
  case 'odel':{if(!d.sure){t.dataset.sure='1';t.innerHTML='Supprimer ?';t.classList.remove('ic');t.classList.add('r');setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.innerHTML=ic('trash');t.classList.add('ic');t.classList.remove('r')}},4000);return}
    const o=byId(d.id);try{await B.status(d.id,fmtSt({base:'deleted',pd:[],gv:(o&&o.gv)||[]}));toast('Commande supprimée (récupérable dans « Annulées »)')}catch(err){fail(err)}return}
  case 'carrive':try{await B.update(d.id,{arrived:new Date().toISOString()});toast('Client signalé arrivé')}catch(err){fail(err)}return;
  case 'unlock':{const h=await sha((S.caisse.pin||'').trim());S.caisse.pin='';if(h===CFG.vcode)S.ventesOK=true;else toast('Code incorrect');break}
  case 'lockv':S.ventesOK=false;break;
  case 'setcode':{const v=(($('#newcode')||{}).value||'').trim();if(!/^\d{4,6}$/.test(v)){toast('Le code doit faire 4 à 6 chiffres');return}const h=await sha(v);try{await B.saveCfg({...CFG,vcode:h});CFG.vcode=h;S.ventesOK=false;toast('Code des ventes enregistré')}catch(err){fail(err)}break}
  case 'rupt':{const R=RUPT();R.has(d.k)?R.delete(d.k):R.add(d.k);const nc={...CFG,rupt:[...R].join('\n')};setCfg(nc);draw();try{await B.saveCfg(nc)}catch(err){fail(err)}return}
  case 'savem':{const nc={...CFG};MENUF.forEach(([k])=>{const el=$('#m-'+k);if(el)nc[k]=el.value});try{await B.saveCfg(nc);setCfg(nc);toast('Menu enregistré')}catch(err){fail(err)}break}
  case 'savecleanup':{const v=($('#cleanup')||{}).value||'00:00';const nc={...CFG,cleanup:v};try{await B.saveCfg(nc);setCfg(nc);toast('Effacement automatique à '+v)}catch(err){fail(err)}break}
  case 'wipe':{if(!d.sure){t.dataset.sure='1';t.innerHTML='Sûr ? Retouchez pour tout effacer';return}try{await B.wipe();toast('Toutes les commandes sont effacées')}catch(err){fail(err)}return}
  case 'unphoto':{try{await B.delPhoto(d.n);delete S.photos[d.n];toast('Photo retirée')}catch(err){fail(err)}break}
  /* cuisine */
  case 'ktab':S.cuisine.tab=d.k;break;
  case 'kready':{const o=byId(d.id);if(!o)return;t.disabled=true;try{await writeSt(o,x=>{if(x.base!=='new')return;if(STATION==='')x.base='ready';else if(!x.pd.includes(STATION))x.pd.push(STATION)})}catch(err){fail(err)}return}
  case 'give':{const o=byId(d.id),k=+d.i;if(!o)return;t.disabled=true;try{await writeSt(o,x=>{if(!x.gv.includes(k))x.gv.push(k)});toast('Frites données : retirées de toutes les tablettes')}catch(err){fail(err)}return}
  case 'khide':{const o=byId(d.id);if(!o)return;const h=hidMap();h[o.id]=o.rev||0;LS.set(hidKey,h);toast('Retirée de cet écran (à retrouver dans « Retirées »)');break}
  case 'kshow':{const o=byId(d.id);if(!o)return;const h=hidMap();delete h[o.id];LS.set(hidKey,h);
    try{let raw=o.raw;if(B.fresh){const fs=await B.fresh(o.id);if(fs!=null)raw=fs}const x=parseSt(raw);
      if(STATION===''){x.base='new';x.pd=[]}else{if(x.base==='ready'){x.pd=[...needSt({...o,gv:x.gv})].filter(y=>y!==STATION);x.base='new'}else x.pd=x.pd.filter(y=>y!==STATION)}
      await B.status(o.id,fmtSt(x));toast('Remise sur cet écran : à refaire')}catch(err){fail(err)}return}
  }
  draw()}
function leaveEdit(){const C=S.caisse;C.edit=null;if(C.held){C.cart=C.held.cart;C.name=C.held.name;C.note=C.held.note;C.mode=C.held.mode;C.held=null}else{C.cart=[];C.name='';C.note='';C.mode='sp'}}
setInterval(()=>{if(MODE==='caisse'&&S.ready){const b=$('.bans');if(b)b.innerHTML=bannersHTML()}},30000);

/* ====================== DÉMARRAGE ====================== */
(async()=>{draw();const ok=await B.init(onData);if(ok)S.ready=true;
  if(MODE==='client'&&S.client.mine&&S.client.mine.day===getDay()){S.client.view='suivi';pollWeb()}else if(MODE==='client'){S.client.mine=null}
  draw()})();

</script></body></html>
